    function QuizView() {
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [isAnswered, setIsAnswered] = useState(false);
      const [score, setScore] = useState(0);
      const [showResult, setShowResult] = useState(false);

      const question = QUIZ_QUESTIONS[currentQIndex];

      const handleSelect = (index) => {
        if (isAnswered) return;
        setSelectedAnswer(index);
        setIsAnswered(true);
        if (index === question.correctAnswer) {
          setScore(score + 1);
        }
      };

      const nextQuestion = () => {
        if (currentQIndex < QUIZ_QUESTIONS.length - 1) {
          setCurrentQIndex(currentQIndex + 1);
          setSelectedAnswer(null);
          setIsAnswered(false);
        } else {
          setShowResult(true);
        }
      };

      const resetQuiz = () => {
        setCurrentQIndex(0);
        setSelectedAnswer(null);
        setIsAnswered(false);
        setScore(0);
        setShowResult(false);
      };

      if (showResult) {
        return (
          <div className="max-w-2xl mx-auto animate-in zoom-in-95 duration-1000">
            <Card className="p-16 text-center border-none bg-white shadow-[0_8px_40px_rgb(0,0,0,0.06)]">
              <p className="text-[#C5A059] text-sm tracking-widest uppercase mb-4">Result</p>
              <h2 className="text-4xl font-light text-zinc-900 mb-12 tracking-widest">クイズ完了</h2>
              
              <div className="text-[6rem] leading-none font-light text-zinc-900 mb-12">
                {score}<span className="text-3xl text-zinc-300 mx-2">/</span><span className="text-4xl text-zinc-400">{QUIZ_QUESTIONS.length}</span>
              </div>

              <p className="text-zinc-500 mb-12 leading-loose text-sm font-light max-w-md mx-auto">
                {score === QUIZ_QUESTIONS.length 
                  ? "完璧です。マネジメントの核となる考え方を完全に理解しています。この知識をチームビルディングに活かしましょう。" 
                  : "マネジメントの基礎を学ぶ良い機会です。日々の業務の中で、これらの考え方を意識してみてください。"}
              </p>

              <Button onClick={resetQuiz} variant="outline" className="mx-auto">
                もう一度挑戦する
              </Button>
            </Card>
          </div>
        );
      }

      return (
        <div className="max-w-3xl mx-auto animate-in fade-in duration-1000">
          <div className="text-center pb-10 border-b border-zinc-200 mb-10">
            <h2 className="text-3xl md:text-4xl font-light text-zinc-900 tracking-widest mb-4">
              マネジメントクイズ
            </h2>
            <div className="flex items-center justify-center gap-4">
              <p className="text-zinc-400 text-sm tracking-widest uppercase">Question</p>
              <span className="text-[#C5A059] font-medium tracking-wider">{currentQIndex + 1} / {QUIZ_QUESTIONS.length}</span>
            </div>
          </div>

          <div className="mb-12">
            <h3 className="text-xl md:text-2xl font-light text-zinc-800 leading-[1.8] tracking-wide text-center">
              {question.question}
            </h3>
          </div>

          <div className="space-y-4 mb-12">
            {question.options.map((opt, index) => {
              let btnClass = "w-full text-left p-6 rounded-2xl border transition-all duration-500 font-light text-sm md:text-base leading-relaxed ";
              
              if (!isAnswered) {
                btnClass += "border-zinc-200 bg-white hover:bg-zinc-50 hover:border-zinc-300 text-zinc-600 hover:text-zinc-900 shadow-sm";
              } else {
                if (index === question.correctAnswer) {
                  btnClass += "border-emerald-200 bg-emerald-50 text-emerald-700 font-medium shadow-sm";
                } else if (index === selectedAnswer) {
                  btnClass += "border-rose-200 bg-rose-50 text-rose-600";
                } else {
                  btnClass += "border-zinc-100 bg-zinc-50 text-zinc-400 opacity-50";
                }
              }

              return (
                <button
                  key={index}
                  onClick={() => handleSelect(index)}
                  disabled={isAnswered}
                  className={btnClass}
                >
                  <div className="flex items-center justify-between gap-6">
                    <span>{opt}</span>
                  </div>
                </button>
              );
            })}
          </div>

          {isAnswered && (
            <div className="animate-in slide-in-from-bottom-8 duration-700">
              <Card className="p-8 border-zinc-200">
                <h4 className={`text-sm font-medium tracking-widest uppercase mb-4 ${selectedAnswer === question.correctAnswer ? 'text-emerald-600' : 'text-rose-500'}`}>
                  {selectedAnswer === question.correctAnswer ? "Correct" : "Incorrect"}
                </h4>
                <p className="text-zinc-600 font-light leading-loose text-sm md:text-base mb-8">
                  {question.explanation}
                </p>
                <div className="flex justify-end">
                  <Button onClick={nextQuestion}>
                    {currentQIndex < QUIZ_QUESTIONS.length - 1 ? "次の問題へ" : "結果を見る"}
                  </Button>
                </div>
              </Card>
            </div>
          )}
        </div>
      );
    }

    function JourneyGameView() {
      const [items, setItems] = useState([]);
      const [isStarted, setIsStarted] = useState(false);
      const [isChecked, setIsChecked] = useState(false);
      const [isCorrect, setIsCorrect] = useState(false);

      useEffect(() => {
        setItems(shuffleArray(JOURNEY_STEPS));
      }, []);

      const moveItem = (index, direction) => {
        if (isChecked) return;
        const newItems = [...items];
        if (direction === 'up' && index > 0) {
          [newItems[index - 1], newItems[index]] = [newItems[index], newItems[index - 1]];
        } else if (direction === 'down' && index < newItems.length - 1) {
          [newItems[index + 1], newItems[index]] = [newItems[index], newItems[index + 1]];
        }
        setItems(newItems);
      };

      const checkOrder = () => {
        const correct = items.every((item, index) => item.id === index + 1);
        setIsCorrect(correct);
        setIsChecked(true);
      };

      const retry = () => {
        setIsChecked(false);
        setIsCorrect(false);
        setItems(shuffleArray(JOURNEY_STEPS));
      };

      if (!isStarted) {
        return (
          <div className="max-w-3xl mx-auto text-center animate-in zoom-in-95 duration-1000 py-16">
            <h2 className="text-3xl md:text-4xl font-light text-zinc-900 mb-4 tracking-widest">
              ヒーローズ・ジャーニー
            </h2>
            <p className="text-[#C5A059] text-sm tracking-widest uppercase mb-12">12 Steps</p>
            <p className="text-zinc-500 text-sm md:text-base mb-16 leading-loose max-w-xl mx-auto font-light">
              バラバラになった12のプロセスを正しい順番に並べ替え、物語の構造を体感して学びましょう。
            </p>
            <Button onClick={() => setIsStarted(true)} variant="outline" className="mx-auto px-10 bg-white">
              ワークを開始する
            </Button>
          </div>
        );
      }

      return (
        <div className="max-w-3xl mx-auto animate-in fade-in duration-1000">
          <div className="text-center pb-8 border-b border-zinc-200 mb-10">
            <h2 className="text-2xl font-light text-zinc-900 tracking-widest mb-2">
              並べ替えワーク
            </h2>
            <p className="text-zinc-400 text-xs tracking-widest uppercase">Order the 12 steps</p>
          </div>

          <div className="flex justify-end mb-8">
            {isChecked && !isCorrect && (
               <Button variant="outline" onClick={retry} className="text-sm px-4 py-2 bg-white">
                 やり直す
               </Button>
            )}
            {!isChecked && (
              <Button onClick={checkOrder} className="text-sm px-6 py-2">
                判定する
              </Button>
            )}
          </div>

          {isChecked && (
            <div className="mb-10 text-center animate-in fade-in">
              <h3 className={`text-lg font-medium tracking-widest uppercase mb-4 ${isCorrect ? 'text-[#C5A059]' : 'text-rose-500'}`}>
                {isCorrect ? "Perfect" : "Incorrect"}
              </h3>
              <p className="text-zinc-500 font-light text-sm">
                {isCorrect 
                  ? "見事です。この12のステップを意識して組織のビジョンを語ることで、メンバーを巻き込む強力なマネジメントが可能になります。"
                  : "順番が違う部分があります。物語の大きな流れを意識してみましょう。"}
              </p>
            </div>
          )}

          <div className="space-y-3">
            {items.map((item, index) => {
              let itemStyle = "bg-white border-zinc-200 shadow-sm";
              let numStyle = "text-zinc-300";
              
              if (isChecked) {
                if (item.id === index + 1) {
                  itemStyle = "bg-[#C5A059]/5 border-[#C5A059]/30";
                  numStyle = "text-[#C5A059]";
                } else {
                  itemStyle = "bg-rose-50 border-rose-200";
                  numStyle = "text-rose-400";
                }
              }

              return (
                <div 
                  key={item.id} 
                  className={`flex items-center gap-6 p-4 rounded-2xl border transition-all duration-500 hover:border-zinc-300 ${itemStyle}`}
                >
                  {!isChecked && (
                    <div className="flex flex-col gap-1 shrink-0">
                      <button 
                        onClick={() => moveItem(index, 'up')}
                        disabled={index === 0}
                        className="text-zinc-400 hover:text-[#C5A059] disabled:opacity-20 transition-colors"
                      >
                        <ChevronUp className="w-5 h-5" />
                      </button>
                      <button 
                        onClick={() => moveItem(index, 'down')}
                        disabled={index === items.length - 1}
                        className="text-zinc-400 hover:text-[#C5A059] disabled:opacity-20 transition-colors"
                      >
                        <ChevronDown className="w-5 h-5" />
                      </button>
                    </div>
                  )}

                  <div className={`w-8 text-center font-light text-sm tracking-widest transition-colors ${numStyle}`}>
                    {isChecked ? (item.id < 10 ? `0${item.id}` : item.id) : (index + 1 < 10 ? `0${index + 1}` : index + 1)}
                  </div>

                  <div className="flex-grow pl-4 border-l border-zinc-100">
                    <h4 className="text-sm font-medium text-zinc-800 mb-1 tracking-wide">{item.text}</h4>
                    <p className="text-xs text-zinc-500 font-light">{item.desc}</p>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // Reactアプリのレンダリング開始
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
